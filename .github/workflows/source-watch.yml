# Tier D1 (detect) + tier D2 (adjudicate).
#
# The two tiers live in one workflow file as two jobs with separate permissions.
# Cross-workflow dispatch driven by GITHUB_TOKEN does not reliably start a second
# workflow, so co-locating them is the dependable way to keep judgement
# event-gated: the `adjudicate` job runs only when `detect` reports a real change.
#
# The `detect` job holds no secret and cannot write. Judgement never runs on an
# unchanged source.
name: Source watch

on:
  schedule:
    # Deliberately off the hour: scheduled runs are delayed or dropped at peak load.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force_adjudication:
        description: 'Run the adjudicator even if no change was detected'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  detect:
    name: Detect status-relevant change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.watch.outputs.changed }}
      changed_sources: ${{ steps.watch.outputs.changed_sources }}
      failed_sources: ${{ steps.watch.outputs.failed_sources }}
      has_key: ${{ steps.creds.outputs.present }}
    steps:
      - uses: actions/checkout@v7

      # The `secrets` context is not available in a job-level `if:`, so key
      # presence is resolved here and threaded through as a job output. Only the
      # boolean is emitted - the key itself is never printed, and passing it via
      # env rather than an expression keeps it out of the rendered command line.
      - name: Check for adjudication credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo 'present=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'present=false' >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fingerprint pinned sources
        id: watch
        run: |
          python3 scripts/watch_sources.py \
            --evidence-out "${RUNNER_TEMP}/evidence.json" \
            | tee "${RUNNER_TEMP}/watch.log"

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: evidence-bundle
          path: ${{ runner.temp }}/evidence.json
          retention-days: 30

      - name: Report unreachable sources
        if: steps.watch.outputs.failed_sources != ''
        run: |
          echo "::warning::Unreachable sources this run: ${{ steps.watch.outputs.failed_sources }}."
          echo "Baselines were preserved and no last-verified date was advanced."
          echo "These rows will age into the staleness window and be raised by the stale guard."

      # The other loss class, and the one with no automatic second net.
      #
      # `collapsed_filter_sources` and `coverage_warning_sources` were written to
      # GITHUB_OUTPUT and into the evidence bundle, and read by nothing. The
      # committed baseline is guarded -- tests/test_watch_sources.py's
      # CommittedBaselineInvariantTests reddens CI if a stored fingerprint shows
      # a collapsed filter -- but that guard only sees a baseline someone
      # re-committed. A collapse that appears in a daily run reached no further
      # than a stderr `[warn]` inside a green run, and `coverage_warning_sources`
      # had no channel at all.
      #
      # Unlike an unreachable source, this one does not raise itself: the fetch
      # SUCCEEDS, so the monthly refresh's "advance only where the source was
      # fetched successfully" criterion still advances the affected rows and they
      # never enter the staleness window. Deliberately not a failure -- the
      # fingerprint is honest about what it saw -- but never silent either.
      #
      # An annotation plus a run-summary entry is what this repository already
      # does for "green, but a human must act" (see the adjudication-deferred
      # job below). Needs nothing past `contents: read`.
      - name: Report coverage loss in the watched signal
        if: steps.watch.outputs.collapsed_filter_sources != '' || steps.watch.outputs.coverage_warning_sources != ''
        env:
          COLLAPSED_SOURCES: ${{ steps.watch.outputs.collapsed_filter_sources }}
          COVERAGE_WARNING_SOURCES: ${{ steps.watch.outputs.coverage_warning_sources }}
        run: |
          echo "::warning::Coverage loss in the watched signal. Collapsed relevance filter: ${COLLAPSED_SOURCES:-none}. Narrowed page-level coverage: ${COVERAGE_WARNING_SOURCES:-none}. Not a failure and not a status change - these sources fetched cleanly while watching less than the registry claims."
          {
            printf '## Coverage loss in the watched signal\n\n'
            printf 'Collapsed relevance filter: %s\n\n' "${COLLAPSED_SOURCES:-none}"
            printf 'Narrowed page-level coverage: %s\n\n' "${COVERAGE_WARNING_SOURCES:-none}"
            cat <<'SUMMARY'
          Neither condition is a failure and neither is a status change: the fetch
          succeeded and the fingerprint is honest about what it saw. What has gone is
          coverage. A source watching less than its registry entry claims reports
          "unchanged" on every later run, which is indistinguishable from a healthy one.

          A collapsed relevance filter means a source declared a narrowing it is not
          achieving: the filter is wrong, or the page restructured out from under it,
          and that source's watched signal has fallen back to its page-level text.
          Narrowed page-level coverage means a filtered source's page has no heading at
          page level, so part of what the entry claims to watch is unreadable. The
          per-source `[warn]` lines are in the `Fingerprint pinned sources` step log,
          and that line, not this heading, is authoritative for which condition fired.

          **This one does not raise itself.** An unreachable source recovers on the next
          run and its rows age into the staleness window; a source listed here fetched
          successfully, so the monthly refresh keeps advancing its rows' last-verified
          dates and the stale guard never sees them. Withholding that advance is a
          judgement someone has to make.

          **What to do:** re-read the source's `relevance_filter` in
          `.github/watch-state/sources.json` against the live page. Either the filter is
          repaired, or the entry's claim about what it watches is corrected. Do not
          re-baseline to make this go away - that stores the degraded signal as the new
          normal.
          SUMMARY
          } >> "${GITHUB_STEP_SUMMARY}"

  # Deferred rather than failed: while no ANTHROPIC_API_KEY is configured, tier D2
  # is operated by hand (docs/agent-cadence.md, "Running tiers D2 and D3
  # locally"). A red run every time a source changes would say "this repository is
  # broken" when the accurate statement is "judgement is queued for a human". The
  # change is still announced loudly - it is a warning annotation and a run-summary
  # entry, not a silent pass.
  adjudication-deferred:
    name: Adjudication deferred to a local run
    needs: detect
    if: (needs.detect.outputs.changed == 'true' || inputs.force_adjudication) && needs.detect.outputs.has_key != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Announce that judgement is queued for a human
        env:
          CHANGED_SOURCES: ${{ needs.detect.outputs.changed_sources }}
        run: |
          echo "::warning::Status-relevant change detected in: ${CHANGED_SOURCES:-none reported}. Tier D2 adjudication did NOT run - no ANTHROPIC_API_KEY is configured. Run it locally; see docs/agent-cadence.md."
          {
            printf '## Adjudication deferred to a local run\n\n'
            printf 'Changed sources this run: %s\n\n' "${CHANGED_SOURCES:-none reported}"
            cat <<'SUMMARY'
          No `ANTHROPIC_API_KEY` is configured, so tier D2 did not run in CI.
          This run is green because nothing failed - judgement is queued for a human,
          not skipped.

          **What to do:** follow *Running tiers D2 and D3 locally* in
          `docs/agent-cadence.md`. The evidence bundle for this run is attached to the
          `detect` job as the `evidence-bundle` artifact - download it and adjudicate
          from it rather than re-fetching, so the D1/D2 split is preserved.

          Every control still applies: the resulting pull request is checked by
          `validate_bot_pr.py` and the `Validate matrix` gate exactly as an automated
          one would be.
          SUMMARY
          } >> "${GITHUB_STEP_SUMMARY}"

  adjudicate:
    name: Adjudicate detected change
    needs: detect
    if: (needs.detect.outputs.changed == 'true' || inputs.force_adjudication) && needs.detect.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download evidence bundle
        uses: actions/download-artifact@v8
        with:
          name: evidence-bundle
          path: evidence

      - name: Adjudicate
        # Pinned to a commit SHA, not a mutable tag: a tag can be repointed at
        # new code, and this step holds an API key and write permissions.
        # 7ff6806 = tag v1 as of 2026-08-08. Re-pin deliberately when upgrading.
        uses: anthropics/claude-code-action@7ff6806c8ebd129a7043b947af920074d3819dc8 # v1
        with:
          # Rotate this secret on the usual cadence; it is never echoed.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The adjudicator is denied network tools by construction: it reasons
          # only over the evidence bundle the watcher produced.
          claude_args: >-
            --allowedTools "Read,Edit,Grep,Glob,Bash(python3 scripts/*),Bash(git *),Bash(gh pr *),Bash(gh issue *)"
          prompt: |
            Follow `.claude/agents/status-adjudicator.md` exactly. It defines your
            role, your permitted writes and your forbidden actions.

            Changed sources this run: ${{ needs.detect.outputs.changed_sources }}
            Evidence bundle: evidence/evidence.json

            Work only from the evidence bundle. You have no network access and must
            not attempt to fetch anything. Open a draft pull request; never merge.

      - name: Validate the adjudicator's output
        run: |
          python3 scripts/validate_bot_pr.py \
            --bot \
            --base-ref "origin/${GITHUB_REF_NAME}" \
            --evidence evidence/evidence.json
