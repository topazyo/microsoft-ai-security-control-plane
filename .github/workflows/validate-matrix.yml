# Deterministic validation gate for every change to the matrix and its
# supporting files - automated or human.
#
# These checks are the mechanical form of rules the repository already states in
# prose: primary sources must be Microsoft Learn or the public Microsoft 365
# Roadmap, status labels must come from the four-label legend, every row must
# carry a last-verified date, and a row may never be moved out of "Requires
# further validation" without in-tenant confirmation by a human.
#
# `pull_request` (not `pull_request_target`) is used deliberately: fork pull
# requests must never receive repository secrets. This job needs none.
name: Validate matrix

# The path filters below deliberately cover the prose files as well as the
# matrix. check_confidentiality scans every changed .md/.json file, so a
# scaffolding- or README-only pull request that did not trigger this workflow
# received no confidentiality scan at all - the check was absent rather than
# green, which is the more dangerous of the two.
#
# The two lists must stay identical. They were not: `.github/watch-state/**` was
# in the pull_request list and missing from the push list, so a baseline- or
# registry-only push to main ran no validation and fingerprints.json - which
# carries verbatim upstream text and is a changed .json - reached main with no
# confidentiality scan. `.claude/**` was in neither, so a change to the tracked
# adjudicator specification, the rules the workflows read, the hooks, or
# settings.json was ungated entirely; those are executable influence surfaces,
# which is exactly why .gitignore keeps them tracked.
on:
  pull_request:
    paths:
      - 'matrix/**'
      - 'crosswalk/**'
      - 'checklists/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'disclaimer.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE*'
      - '.claude/**'
      - '.github/watch-state/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'matrix/**'
      - 'crosswalk/**'
      - 'checklists/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'disclaimer.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE*'
      - '.claude/**'
      - '.github/watch-state/**'
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions: {}

jobs:
  workflows:
    name: Lint workflow definitions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned to an explicit actionlint version rather than :latest, and run as
      # a container image so no script is fetched from the network at run time.
      # actionlint discovers .github/workflows itself from the repository root.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

  validate:
    name: Sourcing, labelling and confidentiality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile the automation scripts
        run: python3 -m compileall -q scripts

      # Standard library only, so there is no install step. These cover the
      # signal scoping the relevance filter depends on and the registry's row
      # mappings - both are places where a defect stays green and silent, which
      # is why they are tested rather than reviewed.
      - name: Run the automation tests
        run: python3 -m unittest discover -s tests -v

      # On a pull request the base is the target branch. On a push it must be the
      # commit before the push, NOT `origin/main`: after checkout of a push to
      # main, `origin/main` IS the pushed commit, so `git diff origin/main...HEAD`
      # is empty and every diff-derived check no-ops -- the path allowlist checks
      # nothing and the confidentiality scan falls back to its four fixed content
      # files. Adding a path filter alone therefore did not get a changed
      # `fingerprints.json` scanned on a push; it only made the repo-state checks
      # run. `github.event.before` is what makes the diff real.
      - name: Validate matrix, sourcing and escalation direction
        run: |
          python3 scripts/validate_bot_pr.py \
            --base-ref "${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}"

      - name: Report staleness (informational)
        run: |
          python3 scripts/stale_guard.py >> "${GITHUB_STEP_SUMMARY}" || true
