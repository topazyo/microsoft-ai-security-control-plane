# Tier D3 - monthly consolidating re-verification.
#
# This is the tier that satisfies the README's "Maintenance & cadence" commitment:
# every row is re-verified against its primary source, last-verified stamps are
# advanced only where the source was actually re-read, and the month's single
# CHANGELOG entry is written.
#
# This job always writes something, even when no status changed. That is
# deliberate for two reasons: the existing 2026-07-14 entry sets the precedent
# that a refresh which changes nothing is still recorded, and GitHub disables
# scheduled workflows after roughly 60 days of repository inactivity - a quiet
# reference repository whose automation never commits can silently switch its own
# schedule off.
name: Monthly refresh

on:
  schedule:
    # 06:23 UTC on the 6th of each month. Off the hour, and clear of month-start load.
    - cron: '23 6 6 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-verify all rows and record the refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Resolved as a step output because the `secrets` context cannot be used in
      # an `if:` directly. Only the boolean is emitted; the key is passed via env
      # and never printed.
      - name: Check for adjudication credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo 'present=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'present=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Re-fetch every pinned source
        id: watch
        run: |
          python3 scripts/watch_sources.py \
            --update-baseline \
            --evidence-out evidence/evidence.json

      - name: Flag unreachable sources
        if: steps.watch.outputs.failed_sources != ''
        run: |
          echo "::warning::Unreachable this run: ${{ steps.watch.outputs.failed_sources }}."
          echo "Rows depending on these sources must NOT have their last-verified date advanced."

      # Matters more here than in the daily watch, because this job runs with
      # --update-baseline: a collapsed filter that is not adjudicated first gets
      # stored as the new normal, and the affected rows still get their dates
      # advanced because their fetch succeeded. See source-watch.yml for the
      # full reasoning.
      - name: Flag coverage loss in the watched signal
        if: steps.watch.outputs.collapsed_filter_sources != '' || steps.watch.outputs.coverage_warning_sources != ''
        env:
          COLLAPSED_SOURCES: ${{ steps.watch.outputs.collapsed_filter_sources }}
          COVERAGE_WARNING_SOURCES: ${{ steps.watch.outputs.coverage_warning_sources }}
        run: |
          echo "::warning::Coverage loss this run. Collapsed relevance filter: ${COLLAPSED_SOURCES:-none}. Narrowed page-level coverage: ${COVERAGE_WARNING_SOURCES:-none}. These sources fetched cleanly while watching less than the registry claims."
          {
            printf '## Coverage loss in the watched signal\n\n'
            printf 'Collapsed relevance filter: %s\n\n' "${COLLAPSED_SOURCES:-none}"
            printf 'Narrowed page-level coverage: %s\n\n' "${COVERAGE_WARNING_SOURCES:-none}"
            cat <<'SUMMARY'
          This run wrote a new baseline. A source listed above fetched successfully while
          watching less than its registry entry claims, so two things follow that the
          unreachable-source case does not have:

          - the degraded signal has just been stored as the new normal, and
          - its rows still satisfy "advance only where the source was fetched
            successfully", so their last-verified dates advance and the stale guard
            never raises them.

          **Do not advance the last-verified date of any row backed by a source listed
          above**, and record the collapse in this refresh's CHANGELOG entry rather than
          letting the new baseline absorb it silently. The per-source `[warn]` lines are
          in the `Re-fetch every pinned source` step log.
          SUMMARY
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Consolidate, update stamps and write the CHANGELOG entry
        if: steps.creds.outputs.present == 'true'
        # Pinned to a commit SHA, not a mutable tag: a tag can be repointed at
        # new code, and this step holds an API key and write permissions.
        # 7ff6806 = tag v1 as of 2026-08-08. Re-pin deliberately when upgrading.
        uses: anthropics/claude-code-action@7ff6806c8ebd129a7043b947af920074d3819dc8 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Edit,Grep,Glob,Bash(python3 scripts/*),Bash(git *),Bash(gh pr *),Bash(gh issue *)"
          prompt: |
            Follow `.claude/agents/status-adjudicator.md` exactly, running the
            monthly consolidation described in its "Monthly consolidation" section.

            Evidence bundle: evidence/evidence.json
            Sources that could NOT be fetched this run: ${{ steps.watch.outputs.failed_sources || 'none' }}
            Sources whose relevance filter COLLAPSED this run (fetched fine, watching nothing): ${{ steps.watch.outputs.collapsed_filter_sources || 'none' }}
            Sources whose page-level coverage NARROWED this run: ${{ steps.watch.outputs.coverage_warning_sources || 'none' }}

            Advance a row's last-verified date only where its source was fetched
            successfully this run AND appears in neither of the two degraded
            lists above. The second condition is not redundant: a degraded source
            fetches successfully while watching less than the registry claims, so
            "fetched successfully" alone would authorise advancing a date on a
            signal that has gone blind. Record any degraded source in the
            CHANGELOG entry rather than letting the new baseline absorb it
            silently.

            Write exactly one CHANGELOG heading for this calendar month using
            `scripts/changelog_entry.py`. Open a draft pull request; never merge.

      - name: Validate the proposed refresh
        if: steps.creds.outputs.present == 'true'
        run: |
          python3 scripts/validate_bot_pr.py \
            --bot \
            --base-ref "origin/${GITHUB_REF_NAME}" \
            --evidence evidence/evidence.json

      # Nothing was committed when the model step is skipped: the --update-baseline
      # write above lives only on the runner and is discarded with it, so the
      # repository's fingerprints are untouched and the next run re-detects the
      # same change. Deferring costs nothing except the human's time.
      #
      # **This step files an issue, and that is the whole point of it.** It used
      # to write only a step summary and a `::warning::` annotation, on a run
      # that concludes *success* -- and GitHub's default Actions notification
      # setting is failed-workflows-only, so the one tier that requires a human
      # was the one tier that never told the human. The 2026-09-06 run is the
      # precedent: it fired, it was green, and nobody heard it. The first
      # notification this repository produced was the stale guard's issue, which
      # by construction arrives only once the window has already been missed.
      - name: Tell a human the monthly consolidation is waiting for them
        if: steps.creds.outputs.present != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SOURCES: ${{ steps.watch.outputs.failed_sources }}
          TITLE: 'Monthly consolidation is waiting on a human'
        run: |
          echo "::warning::Monthly consolidation did NOT run - no ANTHROPIC_API_KEY is configured. Run tier D3 locally; see docs/agent-cadence.md."
          {
            printf '## Monthly consolidation is waiting on a human — %s\n\n' "$(date -u +'%Y-%m')"
            cat <<'BODY'
          No `ANTHROPIC_API_KEY` is configured, so tier D3 did not run in CI.
          This run is green because nothing failed - the consolidation is queued for a
          human, not skipped.

          **Nothing was written to the repository.** The `--update-baseline` write above
          exists only on this runner and is discarded with it, so `fingerprints.json` is
          unchanged and the next run re-detects the same state.
          BODY
            if [ -n "${FAILED_SOURCES}" ]; then
              printf '\n**Unreachable this run:** %s - do not advance those rows dates.\n' "${FAILED_SOURCES}"
            fi
            cat <<'BODY'

          **What to do:** follow *Running tiers D2 and D3 locally* in
          `docs/agent-cadence.md`. Advance a last-verified date only where the source
          was fetched successfully **and** is not listed under *Coverage loss in the
          watched signal* above, and write exactly one CHANGELOG heading for this
          calendar month.

          **How much runway is left**, as this run measured it:

          BODY
            printf '```\n'
            python3 scripts/stale_guard.py
            printf '```\n'
            cat <<'BODY'

          _Raised automatically by the monthly refresh. **Close this when the refresh
          pull request merges.** It is deliberately not closed on a schedule: only a
          human can know whether the consolidation actually happened, and a workflow
          that closed it by the calendar would be retracting an outstanding obligation
          rather than discharging one. If it is still open when the next monthly run
          fires, that run rewrites this body to the new month and appends a comment._
          BODY
          } > "${RUNNER_TEMP}/deferral.md"

          cat "${RUNNER_TEMP}/deferral.md" >> "${GITHUB_STEP_SUMMARY}"

          # Same create-or-update shape as .github/workflows/stale-guard.yml, and
          # the body is edited rather than only appended to for the same reason:
          # the first thing a reader sees must describe the current cycle, not
          # the one the issue happened to be opened in.
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "${RUNNER_TEMP}/deferral.md"
            gh issue comment "$existing" --body-file "${RUNNER_TEMP}/deferral.md"
            echo "Rewrote the body of issue #${existing} and appended this run."
          else
            gh issue create --title "$TITLE" --body-file "${RUNNER_TEMP}/deferral.md"
            echo "Opened a new consolidation-due issue."
          fi

      # Renamed to what it does. It was called "Escalate rows needing in-tenant
      # confirmation" and held a GH_TOKEN, but never invoked `gh` at all -- the
      # token and the job's `issues: write` were dead weight for this step, and
      # nothing was escalated anywhere. Filing and updating the staleness issue
      # belongs to the weekly stale-guard workflow, which does exactly that; a
      # second issue-filer here would duplicate it. So this step reports, and
      # says so in its name.
      #
      # `|| true` is gone, and the gate reads the script's own output instead of
      # grepping its prose: `|| true` turned a crash into "no staleness", and a
      # `grep -q "exceed the"` would have missed any rewording of that sentence.
      - name: Report residual staleness after the refresh
        id: stale
        shell: bash
        run: python3 scripts/stale_guard.py | tee staleness.txt

      - name: Record residual staleness in the run summary
        if: steps.stale.outputs.stale != 'false'
        run: |
          echo "::warning::Staleness remains after the monthly refresh; see the run summary."
          cat staleness.txt >> "${GITHUB_STEP_SUMMARY}"
