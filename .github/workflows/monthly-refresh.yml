# Tier D3 - monthly consolidating re-verification.
#
# This is the tier that satisfies the README's "Maintenance & cadence" commitment:
# every row is re-verified against its primary source, last-verified stamps are
# advanced only where the source was actually re-read, and the month's single
# CHANGELOG entry is written.
#
# This job always writes something, even when no status changed. That is
# deliberate for two reasons: the existing 2026-07-14 entry sets the precedent
# that a refresh which changes nothing is still recorded, and GitHub disables
# scheduled workflows after roughly 60 days of repository inactivity - a quiet
# reference repository whose automation never commits can silently switch its own
# schedule off.
name: Monthly refresh

on:
  schedule:
    # 06:23 UTC on the 6th of each month. Off the hour, and clear of month-start load.
    - cron: '23 6 6 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-verify all rows and record the refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Resolved as a step output because the `secrets` context cannot be used in
      # an `if:` directly. Only the boolean is emitted; the key is passed via env
      # and never printed.
      - name: Check for adjudication credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo 'present=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'present=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Re-fetch every pinned source
        id: watch
        run: |
          python3 scripts/watch_sources.py \
            --update-baseline \
            --evidence-out evidence/evidence.json

      - name: Flag unreachable sources
        if: steps.watch.outputs.failed_sources != ''
        run: |
          echo "::warning::Unreachable this run: ${{ steps.watch.outputs.failed_sources }}."
          echo "Rows depending on these sources must NOT have their last-verified date advanced."

      - name: Consolidate, update stamps and write the CHANGELOG entry
        if: steps.creds.outputs.present == 'true'
        # Pinned to a commit SHA, not a mutable tag: a tag can be repointed at
        # new code, and this step holds an API key and write permissions.
        # 7ff6806 = tag v1 as of 2026-08-08. Re-pin deliberately when upgrading.
        uses: anthropics/claude-code-action@7ff6806c8ebd129a7043b947af920074d3819dc8 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Edit,Grep,Glob,Bash(python3 scripts/*),Bash(git *),Bash(gh pr *),Bash(gh issue *)"
          prompt: |
            Follow `.claude/agents/status-adjudicator.md` exactly, running the
            monthly consolidation described in its "Monthly consolidation" section.

            Evidence bundle: evidence/evidence.json
            Sources that could NOT be fetched this run: ${{ steps.watch.outputs.failed_sources }}

            Advance a row's last-verified date only where its source was fetched
            successfully this run. Write exactly one CHANGELOG heading for this
            calendar month using `scripts/changelog_entry.py`. Open a draft pull
            request; never merge.

      - name: Validate the proposed refresh
        if: steps.creds.outputs.present == 'true'
        run: |
          python3 scripts/validate_bot_pr.py \
            --bot \
            --base-ref "origin/${GITHUB_REF_NAME}" \
            --evidence evidence/evidence.json

      # Nothing was committed when the model step is skipped: the --update-baseline
      # write above lives only on the runner and is discarded with it, so the
      # repository's fingerprints are untouched and the next run re-detects the
      # same change. Deferring costs nothing except the human's time.
      - name: Announce that the monthly consolidation is queued for a human
        if: steps.creds.outputs.present != 'true'
        env:
          FAILED_SOURCES: ${{ steps.watch.outputs.failed_sources }}
        run: |
          echo "::warning::Monthly consolidation did NOT run - no ANTHROPIC_API_KEY is configured. Run tier D3 locally; see docs/agent-cadence.md."
          {
            cat <<'SUMMARY'
          ## Monthly consolidation deferred to a local run

          No `ANTHROPIC_API_KEY` is configured, so tier D3 did not run in CI.
          This run is green because nothing failed - the consolidation is queued for a
          human, not skipped.

          **Nothing was written to the repository.** The `--update-baseline` write above
          exists only on this runner and is discarded with it, so `fingerprints.json` is
          unchanged and the next run re-detects the same state.
          SUMMARY
            if [ -n "${FAILED_SOURCES}" ]; then
              printf '\n**Unreachable this run:** %s - do not advance those rows dates.\n' "${FAILED_SOURCES}"
            fi
            cat <<'SUMMARY'

          **What to do:** follow *Running tiers D2 and D3 locally* in
          `docs/agent-cadence.md`. Advance a last-verified date only where the source
          was fetched successfully, and write exactly one CHANGELOG heading for this
          calendar month.
          SUMMARY
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Escalate rows needing in-tenant confirmation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/stale_guard.py > staleness.txt || true
          if grep -q "exceed the" staleness.txt; then
            echo "::warning::Staleness remains after the monthly refresh; see the run summary."
            cat staleness.txt >> "${GITHUB_STEP_SUMMARY}"
          fi
